<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>Admin — Luki Furniture</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"><style>
:root{--bg:#f5f5f0;--card:#fff;--ink:#202820;--muted:#778076;--line:#e5e8e1;--green:#294333;--soft:#eaf0e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}.wrap{max-width:1080px;margin:auto;padding:26px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font:800 19px Manrope;letter-spacing:2px}.brand small{display:block;font:600 9px 'DM Sans';letter-spacing:2px;color:var(--muted);margin-top:4px}.top a,.muted{color:var(--muted);text-decoration:none}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 30px #1e30200a}h1{font:700 25px Manrope;margin:0 0 7px}h2{font:700 17px Manrope;margin:0 0 17px}.sub{color:var(--muted);line-height:1.6;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:700}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;background:#fff;color:var(--ink);font:13px 'DM Sans';outline:none}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#78917c}.btn{border:0;border-radius:9px;padding:12px 16px;background:var(--green);color:white;font:700 12px 'DM Sans';cursor:pointer}.btn.secondary{background:var(--soft);color:var(--green)}.btn.danger{background:#fbe9e7;color:#9e342c}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.status{padding:12px;border-radius:9px;background:var(--soft);color:var(--green);font-size:12px;margin-top:12px;line-height:1.5}.products{display:grid;gap:10px}.item{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}.item img{width:76px;height:70px;object-fit:cover;border-radius:8px;background:var(--bg)}.item strong{display:block;margin-bottom:5px}.item small{color:var(--muted)}.item-actions{display:flex;gap:7px}.item-actions button{padding:9px 11px}.empty{text-align:center;padding:28px;color:var(--muted)}.login{max-width:440px;margin:9vh auto}.hint{font-size:11px;color:var(--muted);line-height:1.6}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:17px}.item{grid-template-columns:58px 1fr}.item img{width:58px;height:60px}.item-actions{grid-column:1/-1}.top{align-items:flex-start}.wrap{padding-top:18px}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand">LUKI<small>FURNITURE · ADMIN</small></div><a href="./index.html">← Lihat katalog</a></header>

<section id="adminPanel"><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h1>Kelola katalog</h1><p class="sub" style="margin:5px 0 0">Atur nama, kategori, foto, dan spesifikasi produk Luki Furniture. Harga layanan ditampilkan terpisah dari katalog produk.</p></div></div></div>
<div class="panel"><h2 id="formTitle">Tambah produk baru</h2><form id="productForm"><input type="hidden" id="productId"><div class="grid">
<div class="field"><label>Nama produk *</label><input id="name" required placeholder="Contoh: Sofa Minimalis"></div>
<div class="field"><label>Kategori *</label><select id="category" required></select></div>
<div class="field"><label>Material</label><input id="material" placeholder="Kayu jati, kain, besi..."></div>
<div class="field"><label>Ukuran / dimensi</label><input id="dimensions" placeholder="P x L x T"></div>
<div class="field full"><label>Deskripsi singkat</label><input id="short" placeholder="Deskripsi pendek untuk kartu katalog"></div>
<div class="field full"><label>Deskripsi lengkap</label><textarea id="description" placeholder="Jelaskan detail produk..."></textarea></div>
<div class="field"><label>Stok</label><input id="stock" type="number" min="0" value="0"></div>
<div class="field"><label>Foto produk</label><input id="photo" type="file" accept="image/*"></div>
<div class="field"><label><span><input id="featured" type="checkbox" style="width:auto"> Produk unggulan</span></label></div>
<div class="field"><label><span><input id="active" type="checkbox" checked style="width:auto"> Tampilkan di katalog</span></label></div>
</div><div class="actions"><button class="btn" type="submit" id="save">Simpan produk</button><button class="btn secondary" type="button" id="reset">Kosongkan form</button></div><div id="formStatus" class="status hidden"></div></form></div>
<div class="panel"><h2>Daftar produk</h2><div id="productList" class="products"><div class="empty">Memuat produk...</div></div></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://qargnijwavdqcspwqmlu.supabase.co',SUPABASE_KEY='sb_publishable_YGPdNyRX8n7ryQhh5a6EAQ_aWc-Ggeg';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function message(id,text){$(id).textContent=text;$(id).classList.remove('hidden')}
function slugify(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
async function loadCategories(){const {data,error}=await db.from('categories').select('id,name').eq('is_active',true).order('sort_order');if(error){message('formStatus','Gagal memuat kategori: '+error.message);return}$('category').innerHTML=(data||[]).map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')}
async function loadProducts(){const {data,error}=await db.from('products').select('id,name,cover_image,is_active,categories(name)').order('created_at',{ascending:false});if(error){$('productList').textContent='Gagal memuat produk: '+error.message;return}if(!data?.length){$('productList').innerHTML='<div class="empty">Belum ada produk. Tambahkan produk pertama melalui formulir di atas.</div>';return}$('productList').innerHTML=data.map(p=>'<article class="item"><img src="'+(p.cover_image||'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=240&q=75')+'" alt=""><div><strong>'+p.name+'</strong><small>'+(p.categories?.name||'Tanpa kategori')+' · '+(p.is_active?'Tampil':'Disembunyikan')+'</small></div><div class="item-actions"><button class="btn secondary" data-edit="'+p.id+'">Edit</button><button class="btn danger" data-delete="'+p.id+'">Hapus</button></div></article>').join('');$('productList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));$('productList').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete))}
async function editProduct(id){const {data,error}=await db.from('products').select('*').eq('id',id).single();if(error){alert(error.message);return}const fields={productId:'id',name:'name',category:'category_id',material:'material',dimensions:'dimensions',short:'short_description',description:'description',stock:'stock'};Object.entries(fields).forEach(([el,key])=>$(el).value=data[key]??'');$('featured').checked=data.is_featured;$('active').checked=data.is_active;$('formTitle').textContent='Edit produk';$('save').textContent='Perbarui produk';window.scrollTo({top:0,behavior:'smooth'})}
async function deleteProduct(id){if(!confirm('Hapus produk ini dari katalog?'))return;const {error}=await db.from('products').delete().eq('id',id);if(error)alert('Gagal menghapus: '+error.message);else await loadProducts()}
$('reset').onclick=()=>{$('productForm').reset();$('productId').value='';$('stock').value=0;$('active').checked=true;$('formTitle').textContent='Tambah produk baru';$('save').textContent='Simpan produk';$('formStatus').classList.add('hidden')};
$('productForm').onsubmit=async e=>{e.preventDefault();const b=$('save');b.disabled=true;b.textContent='Menyimpan...';try{let cover=null;const file=$('photo').files[0];if(file){if(!file.type.startsWith('image/'))throw Error('File harus berupa gambar.');if(file.size>8*1024*1024)throw Error('Ukuran foto maksimal 8 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const up=await db.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error;cover=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
const name=$('name').value.trim(),id=$('productId').value;const payload={name,slug:slugify(name)+(id?'-'+id.slice(0,6):'-'+Date.now().toString(36)),category_id:$('category').value||null,material:$('material').value.trim()||null,dimensions:$('dimensions').value.trim()||null,short_description:$('short').value.trim()||null,description:$('description').value.trim()||null,stock:Number($('stock').value||0),is_featured:$('featured').checked,is_active:$('active').checked};if(cover)payload.cover_image=cover;const result=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(result.error)throw result.error;message('formStatus',id?'Produk berhasil diperbarui.':'Produk berhasil ditambahkan.');$('reset').click();await loadProducts()}catch(err){message('formStatus','Gagal menyimpan: '+err.message)}finally{b.disabled=false;b.textContent=$('productId').value?'Perbarui produk':'Simpan produk'}};
loadCategories();loadProducts();
</script></body></html>
